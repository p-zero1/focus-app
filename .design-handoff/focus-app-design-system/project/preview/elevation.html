<!doctype html>
<html data-mode="focus"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .demo { display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 0; }
  .box { width:120px; height:60px; background:var(--surface); border:1px solid var(--border-soft); border-radius:12px; }
  .orb { width:48px; height:48px; border-radius:50%; background:radial-gradient(circle at 38% 32%, #B5AFFF, #6C63FF 60%, #2A1F8F); }
  .nm { font-size:12px; font-weight:600; }
  .meta { font-family:var(--font-mono); font-size:10px; color:var(--text-2); }
</style></head>
<body><div class="card">
  <div class="label">Elevation · outer shadows</div>
  <div class="grid">
    <div class="demo"><div class="box" style="box-shadow:0 4px 16px rgba(0,0,0,0.32)"></div><div class="nm">Card</div><div class="meta">0 4 16 / .32</div></div>
    <div class="demo"><div class="box" style="box-shadow:0 -8px 32px rgba(0,0,0,0.4);border-radius:24px 24px 0 0;height:50px"></div><div class="nm">Sheet</div><div class="meta">0 -8 32 / .40</div></div>
    <div class="demo"><div class="box" style="box-shadow:0 24px 64px rgba(0,0,0,0.5);border-radius:24px"></div><div class="nm">Dialog</div><div class="meta">0 24 64 / .50</div></div>
  </div>
  <div class="label" style="margin-top:8px">Inner / colored glows</div>
  <div class="grid">
    <div class="demo"><div class="orb" style="box-shadow:0 0 80px 8px rgba(108,99,255,0.5)"></div><div class="nm">Orb</div><div class="meta">primary · 80 / 8</div></div>
    <div class="demo"><div class="orb" style="background:radial-gradient(circle at 38% 32%, #A5E5A8, #4CAF50 60%, #1F5F22);box-shadow:0 0 32px 0 rgba(76,175,80,0.35)"></div><div class="nm">Success</div><div class="meta">success · 32</div></div>
    <div class="demo"><div class="orb" style="background:radial-gradient(circle at 38% 32%, #FFB5B5, #FF6B6B 60%, #8F2A2A);box-shadow:0 0 32px 0 rgba(255,107,107,0.35)"></div><div class="nm">Warning</div><div class="meta">warning · 32</div></div>
  </div>
</div></body></html>
