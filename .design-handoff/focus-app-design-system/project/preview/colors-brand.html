<!doctype html>
<html data-mode="focus"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .swatch { display:flex; flex-direction:column; gap:6px; flex:1; }
  .chip { height:64px; border-radius:12px; border:1px solid var(--border-soft); }
  .name { font-size:13px; font-weight:600; color:var(--text-1); }
  .hex { font-family:var(--font-mono); font-size:11px; color:var(--text-2); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
</style></head>
<body><div class="card">
  <div class="label">Brand · semantic colors</div>
  <div class="grid">
    <div class="swatch"><div class="chip" style="background:#6C63FF;box-shadow:0 0 24px rgba(108,99,255,0.4)"></div><div class="name">Primary</div><div class="hex">#6C63FF</div></div>
    <div class="swatch"><div class="chip" style="background:#FFB347;box-shadow:0 0 20px rgba(255,179,71,0.3)"></div><div class="name">Accent · XP</div><div class="hex">#FFB347</div></div>
    <div class="swatch"><div class="chip" style="background:#4CAF50"></div><div class="name">Success · Clean</div><div class="hex">#4CAF50</div></div>
    <div class="swatch"><div class="chip" style="background:#FF6B6B"></div><div class="name">Warning · Distract</div><div class="hex">#FF6B6B</div></div>
  </div>
</div></body></html>
