<!doctype html>
<html data-mode="focus"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .chip { display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 16px; border-radius:999px; font-size:14px; font-weight:500; border:1px solid var(--border-soft); color:var(--text-2); background:transparent; cursor:pointer; }
  .chip.on { background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 0 16px rgba(108,99,255,0.35); }
  .chip.tag { background:rgba(108,99,255,0.16); color:#B5AFFF; border-color:rgba(108,99,255,0.3); height:28px; padding:0 12px; font-size:12px; }
  .row { gap:8px; flex-wrap:wrap; }
</style></head>
<body><div class="card">
  <div class="label">Mode chips</div>
  <div class="row">
    <button class="chip on">Pomodoro</button>
    <button class="chip">Deep Work</button>
    <button class="chip">Study</button>
    <button class="chip">Custom</button>
  </div>
  <div class="label" style="margin-top:6px">Strictness</div>
  <div class="row">
    <button class="chip">Relaxed</button>
    <button class="chip on">Strict</button>
    <button class="chip">Hardcore</button>
  </div>
  <div class="label" style="margin-top:6px">Tag chips · history filter</div>
  <div class="row">
    <span class="chip tag">All</span>
    <span class="chip tag">DSA</span>
    <span class="chip tag">Project X</span>
    <span class="chip tag">Reading</span>
  </div>
</div></body></html>
