<!doctype html>
<html data-mode="focus"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row2 { display:flex; justify-content:space-between; align-items:baseline; gap:16px; }
  .row2 + .row2 { border-top:1px solid var(--border-soft); padding-top:10px; }
  .meta { font-family:var(--font-mono); font-size:11px; color:var(--text-2); white-space:nowrap; }
</style></head>
<body><div class="card">
  <div class="label">Headings & body</div>
  <div class="row2"><div style="font-size:32px;font-weight:700;letter-spacing:-0.02em">Session complete</div><div class="meta">H1 · 32 / 700</div></div>
  <div class="row2"><div style="font-size:24px;font-weight:600;letter-spacing:-0.02em">Focus score</div><div class="meta">H2 · 24 / 600</div></div>
  <div class="row2"><div style="font-size:20px;font-weight:600">Best focus time</div><div class="meta">H3 · 20 / 600</div></div>
  <div class="row2"><div style="font-size:16px;font-weight:400">You focus best between 10 AM – 12 PM</div><div class="meta">Body · 16 / 400</div></div>
  <div class="row2"><div style="font-size:14px;font-weight:400;color:var(--text-2)">DSA — 4 sessions · 3h 20m total</div><div class="meta">Body sm · 14</div></div>
  <div class="row2"><div style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-2)">Streak</div><div class="meta">Overline · 11 / 600</div></div>
</div></body></html>
