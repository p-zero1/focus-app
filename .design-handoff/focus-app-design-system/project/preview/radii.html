<!doctype html>
<html data-mode="focus"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:14px; }
  .demo { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .box { width:60px; height:60px; background:var(--surface-2); border:1px solid var(--border-soft); }
  .nm { font-size:11px; font-weight:600; color:var(--text-1); }
  .px { font-family:var(--font-mono); font-size:10px; color:var(--text-2); }
</style></head>
<body><div class="card">
  <div class="label">Radii</div>
  <div class="grid">
    <div class="demo"><div class="box" style="border-radius:4px"></div><div class="nm">xs</div><div class="px">4</div></div>
    <div class="demo"><div class="box" style="border-radius:8px"></div><div class="nm">sm</div><div class="px">8</div></div>
    <div class="demo"><div class="box" style="border-radius:12px"></div><div class="nm">md</div><div class="px">12</div></div>
    <div class="demo"><div class="box" style="border-radius:16px"></div><div class="nm">lg · card</div><div class="px">16</div></div>
    <div class="demo"><div class="box" style="border-radius:24px"></div><div class="nm">xl · sheet</div><div class="px">24</div></div>
    <div class="demo"><div class="box" style="border-radius:999px;width:80px;height:32px"></div><div class="nm">pill</div><div class="px">999</div></div>
    <div class="demo"><div class="box" style="border-radius:50%"></div><div class="nm">circle</div><div class="px">50%</div></div>
  </div>
</div></body></html>
