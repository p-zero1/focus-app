<!doctype html>
<html data-mode="focus"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .nav { display:flex; height:72px; background:rgba(26,26,46,0.92); backdrop-filter:blur(24px); border-top:1px solid var(--border-soft); border-radius:18px; overflow:hidden; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--text-2); font-size:11px; font-weight:500; }
  .tab.on { color:var(--primary); }
  .icon { font-family:'Material Symbols Rounded'; font-size:26px; font-variation-settings:'FILL' 0; }
  .tab.on .icon { font-variation-settings:'FILL' 1; text-shadow:0 0 18px rgba(108,99,255,0.6); }
</style></head>
<body><div class="card">
  <div class="label">Bottom navigation · 4 tabs</div>
  <div class="nav">
    <div class="tab on"><span class="icon">home</span><span>Timer</span></div>
    <div class="tab"><span class="icon">bar_chart</span><span>Analytics</span></div>
    <div class="tab"><span class="icon">list</span><span>History</span></div>
    <div class="tab"><span class="icon">person</span><span>Profile</span></div>
  </div>
</div></body></html>
