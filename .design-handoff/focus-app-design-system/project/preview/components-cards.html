<!doctype html>
<html data-mode="focus"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { gap:12px; align-items:stretch; }
  .c { background:var(--surface); border:1px solid var(--border-soft); border-radius:16px; padding:18px; box-shadow:0 4px 16px rgba(0,0,0,0.32); flex:1; display:flex; flex-direction:column; gap:6px; }
  .c.gauge { align-items:center; }
  .gauge-ring { width:80px; height:80px; border-radius:50%; background:conic-gradient(#4CAF50 0 76%, rgba(255,255,255,0.08) 76%); display:flex; align-items:center; justify-content:center; margin:4px 0; }
  .gauge-inner { width:64px; height:64px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .session-row { display:flex; align-items:center; gap:12px; padding:12px; background:var(--surface); border-radius:14px; border:1px solid var(--border-soft); }
  .session-icon { width:36px; height:36px; border-radius:10px; background:rgba(108,99,255,0.18); color:#B5AFFF; display:flex; align-items:center; justify-content:center; font-family:'Material Symbols Rounded'; font-size:20px; }
  .tag-pill { font-size:11px; font-weight:500; background:rgba(108,99,255,0.16); color:#B5AFFF; padding:2px 8px; border-radius:999px; }
  .meta { font-size:12px; color:var(--text-2); }
</style></head>
<body><div class="card">
  <div class="label">Stat & session cards</div>
  <div class="row">
    <div class="c gauge">
      <div style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-2);font-weight:600">Focus score</div>
      <div class="gauge-ring"><div class="gauge-inner"><div style="font-size:22px;font-weight:700">76</div></div></div>
      <div style="font-size:12px;color:var(--text-2)">This week</div>
    </div>
    <div class="c">
      <div style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-2);font-weight:600">Best focus time</div>
      <div style="font-size:18px;font-weight:600;line-height:1.3">10 AM – 12 PM</div>
      <div style="font-size:13px;color:var(--text-2);line-height:1.4">You focus best in the late morning.</div>
    </div>
  </div>
  <div class="session-row">
    <div class="session-icon" style="font-variation-settings:'FILL' 1">bolt</div>
    <div style="flex:1;display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;align-items:center;gap:8px"><span style="font-weight:600;font-size:14px">Pomodoro</span><span class="tag-pill">DSA</span></div>
      <div class="meta">May 5 · 10:30 AM</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
      <div style="font-weight:600;font-size:14px">45 min</div>
      <div class="meta" style="display:flex;align-items:center;gap:4px"><span style="color:#FF6B6B">●</span> 2</div>
    </div>
  </div>
</div></body></html>
