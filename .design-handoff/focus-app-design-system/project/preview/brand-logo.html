<!doctype html>
<html data-mode="focus"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { gap:32px; align-items:center; padding:6px 0; }
  .panel { flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; padding:18px; border-radius:14px; border:1px solid var(--border-soft); }
  .dark { background:#0F0F1A; }
  .light { background:#F2F0FF; }
  .nm { font-size:11px; color:var(--text-2); letter-spacing:0.08em; text-transform:uppercase; font-weight:600; }
  .light .nm { color:#5A5A77; }
</style></head>
<body><div class="card">
  <div class="label">Logo mark & wordmark · ⚠️ generated placeholder</div>
  <div class="row">
    <div class="panel dark">
      <img src="../assets/wordmark.svg" width="220" alt="">
      <div class="nm">On dark · default</div>
    </div>
    <div class="panel dark" style="flex:0 0 140px">
      <img src="../assets/logo.svg" width="64" alt="">
      <div class="nm">Mark</div>
    </div>
  </div>
</div></body></html>
