<!doctype html>
<html data-mode="focus"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  button { font-family:var(--font-sans); cursor:pointer; border:none; transition:transform 120ms var(--ease-out), filter 120ms var(--ease-out); }
  button:active { transform:scale(0.97); filter:brightness(0.92); }
  .icon { font-family:'Material Symbols Rounded'; font-variation-settings:'FILL' 1; }

  /* Hero start — the moneymaker */
  .start-hero {
    width:100%; height:64px; border-radius:20px; color:#fff;
    font-size:17px; font-weight:700; letter-spacing:-0.01em;
    background:
      radial-gradient(120% 200% at 0% 0%, rgba(255,255,255,0.22), transparent 40%),
      linear-gradient(180deg, #837BFF 0%, #6C63FF 50%, #5A52E0 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.14) inset,
      0 1px 0 0 rgba(255,255,255,0.35) inset,
      0 8px 32px rgba(108,99,255,0.45),
      0 2px 8px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center; gap:10px;
    position:relative; overflow:hidden;
  }
  .start-hero::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0.18), transparent 50%);
    border-radius:inherit; pointer-events:none;
  }
  .start-hero .icon { font-size:22px; }

  /* Inline · 3 sizes */
  .btn-md { height:44px; padding:0 22px; border-radius:14px; font-size:14px; font-weight:600;
    color:#fff; background:linear-gradient(180deg, #7B72FF, #6C63FF);
    box-shadow:0 0 0 1px rgba(255,255,255,0.12) inset, 0 4px 14px rgba(108,99,255,0.35); }
  .btn-sm { height:32px; padding:0 14px; border-radius:10px; font-size:12.5px; font-weight:600;
    color:#fff; background:var(--surface-2); border:1px solid var(--border-strong); }

  /* Ghost / glass */
  .btn-ghost { height:44px; padding:0 22px; border-radius:14px; font-size:14px; font-weight:600;
    color:var(--text-1); background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.10);
    backdrop-filter:blur(12px); }

  /* Destructive */
  .btn-danger { height:44px; padding:0 22px; border-radius:14px; font-size:14px; font-weight:600;
    color:#fff;
    background:linear-gradient(180deg, #FF8585, #FF6B6B);
    box-shadow:0 0 0 1px rgba(255,255,255,0.14) inset, 0 4px 16px rgba(255,107,107,0.35); }

  /* Circular session controls — what the user sees DURING a session */
  .ring-wrap { display:flex; gap:18px; align-items:center; padding:6px 0; }
  .circ {
    width:52px; height:52px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    color:#fff; position:relative;
  }
  .circ .icon { font-size:22px; position:relative; z-index:1; }
  .circ.primary {
    background:radial-gradient(circle at 35% 30%, #B5AFFF, #6C63FF 60%, #3A2F8F);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.18) inset,
      0 0 32px 4px rgba(108,99,255,0.55),
      0 6px 20px rgba(0,0,0,0.4);
  }
  .circ.primary::before {
    content:""; position:absolute; inset:-6px; border-radius:50%;
    border:1px solid rgba(108,99,255,0.35);
  }
  .circ.primary::after {
    content:""; position:absolute; inset:-14px; border-radius:50%;
    border:1px solid rgba(108,99,255,0.18);
  }
  .circ.glass {
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.14);
    box-shadow:0 4px 16px rgba(0,0,0,0.35);
  }
  .circ.danger {
    background:radial-gradient(circle at 35% 30%, #FFB5B5, #FF6B6B 60%, #8F2A2A);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.18) inset,
      0 0 28px 2px rgba(255,107,107,0.45),
      0 6px 20px rgba(0,0,0,0.4);
  }
  .circ.sm { width:40px; height:40px; }
  .circ.sm .icon { font-size:18px; }

  /* FAB-style — the iconic "tap to focus" */
  .start-fab {
    width:88px; height:88px; border-radius:50%;
    color:#fff; display:inline-flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, #B5AFFF, #6C63FF 55%, #2A1F8F);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.22) inset,
      0 0 60px 6px rgba(108,99,255,0.6),
      0 12px 32px rgba(0,0,0,0.5);
    position:relative;
  }
  .start-fab::before { content:""; position:absolute; inset:-10px; border-radius:50%; border:1px solid rgba(108,99,255,0.35); }
  .start-fab::after  { content:""; position:absolute; inset:-22px; border-radius:50%; border:1px solid rgba(108,99,255,0.16); }
  .start-fab .icon { font-size:38px; margin-left:4px; }

  .label-row { display:flex; align-items:center; justify-content:space-between; }
  .meta { font-family:var(--font-mono); font-size:10px; color:var(--text-3); }
  .row { gap:10px; flex-wrap:wrap; align-items:center; }
</style></head>
<body><div class="card">

  <div class="label-row"><span class="label">Primary · full-width hero</span><span class="meta">64h · 20r · gradient + inner light</span></div>
  <button class="start-hero"><span class="icon">play_arrow</span>Start session</button>

  <div class="label-row" style="margin-top:6px"><span class="label">Inline buttons</span><span class="meta">md · sm · ghost · danger</span></div>
  <div class="row">
    <button class="btn-md"><span class="icon" style="font-size:18px;vertical-align:-3px;margin-right:6px">play_arrow</span>Start break</button>
    <button class="btn-ghost">Skip</button>
    <button class="btn-danger">End session</button>
    <button class="btn-sm">Custom…</button>
  </div>

  <div class="label-row" style="margin-top:6px"><span class="label">Session controls · circular · live</span><span class="meta">orbit rings · glow scales with state</span></div>
  <div class="ring-wrap">
    <button class="start-fab" aria-label="Start"><span class="icon">play_arrow</span></button>
    <button class="circ primary" aria-label="Resume"><span class="icon">play_arrow</span></button>
    <button class="circ glass" aria-label="Pause"><span class="icon">pause</span></button>
    <button class="circ danger" aria-label="Stop"><span class="icon">stop</span></button>
    <button class="circ sm glass" aria-label="Skip"><span class="icon">skip_next</span></button>
  </div>

</div></body></html>
