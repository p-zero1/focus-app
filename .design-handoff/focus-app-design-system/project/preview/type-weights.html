<!doctype html>
<html data-mode="focus"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">

  .stack { display:flex; flex-direction:column; gap:8px; }
  .row3 { display:flex; align-items:center; gap:14px; }
  .name { font-size:13px; font-weight:700; flex:1; }
  .meta { font-family:var(--font-mono); font-size:11px; color:var(--text-2); }
</style></head>
<body><div class="card">
  <div class="label">Inter · weights in use</div>
  <div class="stack">

    <div class="row3"><div class="name" style="font-weight:500">Medium — chip & button labels</div><div class="meta">500</div></div>
    <div class="row3"><div class="name" style="font-weight:600">Semibold — card titles, H2/H3</div><div class="meta">600</div></div>
    <div class="row3"><div class="name" style="font-weight:700">Bold — H1, display, timer</div><div class="meta">700</div></div>
    <div class="row3"><div class="name" style="font-weight:800">Extrabold — emphasis only</div><div class="meta">800</div></div>
